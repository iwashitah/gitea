name: "Frogbot Scan Repository"
on:
  workflow_dispatch:
  schedule:
    # The repository will be scanned once a day at 00:00 GMT.
    - cron: "0 0 * * 0"
permissions:
  contents: write
  pull-requests: write
  security-events: write
  # [Mandatory If using OIDC authentication protocol instead of JF_ACCESS_TOKEN]
  id-token: write
jobs:
  scan-repository:
    runs-on: ubuntu-latest
    name: Scan Repository (${{ matrix.branch }} branch)
    strategy:
      matrix:
        branch: [ "main" ]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ matrix.branch }}
      - uses: jfrog/frogbot@eb4b14765ca0e7a2944f6c80c2d659ff7e9f9869
        env:
          JF_URL: 'https://iwashitah6.jfrog.io'
#          JF_USER: ${{ secrets.JF_USER }}
#          JF_PASSWORD: ${{ secrets.JF_PASSWORD }}
#          JF_ACCESS_TOKEN: ${{ secrets.JF_ACCESS_TOKEN }}
          JF_GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JF_GIT_BASE_BRANCH: ${{ matrix.branch }}
          JF_PROJECT_KEY: 'swis-test1008'
          JF_PROJECT: 'swis-test1008'
          JF_WATCHES: 'swis-test1008-watch'
          JFROG_CLI_LOG_LEVEL: 'DEBUG'
          CI: 'true'
        with:
          oidc-provider-name: 'swis-test1008-oidc'
          oidc-audience: 'jfrog-ghec'
          version: '3.8.0'
#          oidc-provider-name: github-artifactory
#          oidc-audience: jfrog-github
